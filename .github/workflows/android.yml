name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spotlight-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Publishes the freshly built debug APK to a single rolling "nightly" release so
  # the README download link always points at the latest build (a raw .apk, no zip).
  # Runs only for main (or a manual dispatch on main); skipped for PRs/feature pushes.
  release:
    name: Publish rolling debug APK
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: spotlight-debug-apk
          path: apk

      - name: Stage APK under a stable name
        run: |
          mkdir -p dist
          cp "$(find apk -name '*.apk' | head -n1)" dist/spotlight-debug.apk

      - name: Publish to rolling "nightly" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Spotlight (latest debug build)
          prerelease: true
          files: dist/spotlight-debug.apk
          body: |
            Auto-published debug APK, rebuilt on every push to `main`.

            Commit: ${{ github.sha }}

            Debug-signed. Enable *Install unknown apps* on your phone, then open the APK. Requires Android 8.0+ (minSdk 26).
